name: Nightly data pipeline

on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC daily
  workflow_dispatch:
    inputs:
      resume_from_run:
        description: "Resume a failed run's bronze files without repeating reel topic searches"
        type: string
        required: false
      apify_boost_usd:
        description: "One-off backfill: dollars of this month's free Apify credit to spend now (0 = spread evenly; always stays under the cap)"
        type: string
        default: "0"
      crawl_minutes:
        description: "Minutes to crawl creator feeds with the Graph API (pauses for Meta's hourly limit)"
        type: string
        default: "240"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # up to 4 h of rate-limited Graph crawling, then the build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch tip when the job starts: a queued run must not rebuild on data that moved since
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tesseract for reel cover OCR
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr >/dev/null
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-minilm-l6-v2
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Restore bronze for a resumed run
        if: inputs.resume_from_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN: ${{ inputs.resume_from_run }}
        run: |
          [[ "$RESUME_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RESUME_RUN" --name "bronze-$RESUME_RUN" --dir data/bronze
      - name: Run pipeline (discover → enrich → silver → embed → match → score → quality → eval → gold)
        env:
          # A fine-grained PAT (public repo read) raises GraphQL limits; GITHUB_TOKEN works for this catalog size.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
          PYTHONUNBUFFERED: "1"
          RESUME_RUN: ${{ inputs.resume_from_run }}
          CRAWL_MINUTES: ${{ inputs.crawl_minutes || '240' }}
          APIFY_BOOST_USD: ${{ inputs.apify_boost_usd || '0' }}
          # Free automated reel discovery (optional; the run works without them):
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}          # Apify free plan, $5/month credit, guarded
          IG_USER_ID: ${{ secrets.IG_USER_ID }}            # Meta Graph API (free): creator feeds + hashtag search
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "$RESUME_RUN" ]; then
            python -m pipeline.cli run --resume
          else
            python -m pipeline.cli run
          fi
      - name: Keep raw bronze files for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: data/bronze
          retention-days: 7
      - name: Commit refreshed data
        if: ${{ !cancelled() }}   # keep crawl progress (history) even if a later stage failed; gold is only written on success
        run: |
          git config user.name "reporeel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history web/public/data
          git diff --cached --quiet && echo "no changes" || git commit -m "data: nightly refresh $(date -u +%F)"
          git pull --rebase origin main   # code may have landed during a long crawl
          git push

  deploy:
    needs: pipeline
    uses: ./.github/workflows/deploy.yml
