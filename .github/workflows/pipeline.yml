name: Nightly data pipeline

on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-minilm-l6-v2
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run pipeline (discover → enrich → silver → embed → match → score → quality → eval → gold)
        env:
          # A fine-grained PAT (public repo read) raises GraphQL limits; GITHUB_TOKEN works for this catalog size.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.cli run
      - name: Keep raw bronze files for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: data/bronze
          retention-days: 7
      - name: Commit refreshed data
        run: |
          git config user.name "reporeel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history web/public/data
          git diff --cached --quiet && echo "no changes" || git commit -m "data: nightly refresh $(date -u +%F)"
          git push

  deploy:
    needs: pipeline
    uses: ./.github/workflows/deploy.yml
