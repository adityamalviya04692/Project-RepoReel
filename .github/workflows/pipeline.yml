name: Nightly data pipeline

on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC daily
  workflow_dispatch:
    inputs:
      resume_from_run:
        description: "Resume a failed run's bronze files without repeating reel topic searches"
        type: string
        required: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-minilm-l6-v2
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Restore bronze for a resumed run
        if: inputs.resume_from_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN: ${{ inputs.resume_from_run }}
        run: |
          [[ "$RESUME_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RESUME_RUN" --name "bronze-$RESUME_RUN" --dir data/bronze
      - name: Run pipeline (discover → enrich → silver → embed → match → score → quality → eval → gold)
        env:
          # A fine-grained PAT (public repo read) raises GraphQL limits; GITHUB_TOKEN works for this catalog size.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
          PYTHONUNBUFFERED: "1"
          RESUME_RUN: ${{ inputs.resume_from_run }}
          # Free automated reel discovery (optional; the run works without them):
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}          # Apify free plan, $5/month credit, guarded
          IG_USER_ID: ${{ secrets.IG_USER_ID }}            # Meta Graph API (free), for creator followers
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "$RESUME_RUN" ]; then
            python -m pipeline.cli run --resume
          else
            python -m pipeline.cli run
          fi
      - name: Keep raw bronze files for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: data/bronze
          retention-days: 7
      - name: Commit refreshed data
        run: |
          git config user.name "reporeel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history web/public/data
          git diff --cached --quiet && echo "no changes" || git commit -m "data: nightly refresh $(date -u +%F)"
          git push

  deploy:
    needs: pipeline
    uses: ./.github/workflows/deploy.yml
